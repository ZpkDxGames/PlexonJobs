name: Publish PlexonJobs 1.0.0 RC2 Once

on:
  push:
    branches:
      - phase2/1.0.0-runtime-correctness-hardening

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-1.0.0-rc.2]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse conflicting publication
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v1.0.0-rc.2' >/dev/null 2>&1; then
            echo 'v1.0.0-rc.2 release already exists; refusing overwrite.' >&2
            exit 1
          fi
          existing=$(git rev-parse -q --verify 'refs/tags/v1.0.0-rc.2^{commit}' 2>/dev/null || true)
          if [[ -n "${existing}" && "${existing}" != "${GITHUB_SHA}" ]]; then
            echo "Existing RC2 tag targets ${existing}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require exact-head source and PR CI
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")
            failed=$(jq -r '[.workflow_runs[] | select(.name=="Build" and .status=="completed" and (.conclusion!="success"))] | length' <<<"${runs}")
            if [[ "${failed}" != "0" ]]; then
              echo 'An exact-head Build run failed; refusing publication.' >&2
              exit 1
            fi
            push_ok=$(jq -r '[.workflow_runs[] | select(.name=="Build" and .event=="push" and .status=="completed" and .conclusion=="success")] | length' <<<"${runs}")
            pr_ok=$(jq -r '[.workflow_runs[] | select(.name=="Build" and .event=="pull_request" and .status=="completed" and .conclusion=="success")] | length' <<<"${runs}")
            if [[ "${push_ok}" -ge 1 && "${pr_ok}" -ge 1 ]]; then ready=1; break; fi
            sleep 5
          done
          if [[ "${ready}" != "1" ]]; then
            echo 'Exact-head source and PR CI did not both complete successfully.' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision exact PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Build exact tag payload
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Generate RC2 evidence assets
        shell: bash
        run: |
          set -euo pipefail
          cp build/libs/PlexonJobs-1.0.0.jar build/PlexonJobs-1.0.0-rc.2.jar
          sha256sum build/PlexonJobs-1.0.0-rc.2.jar | sed 's#build/##' > build/SHA256SUMS.txt
          (cd build && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = dict(tests=0, failures=0, errors=0, skipped=0)
          files = glob.glob('build/test-results/test/TEST-*.xml')
          if not files: raise SystemExit('no JUnit XML results')
          for p in files:
              r = ET.parse(p).getroot()
              for k in t: t[k] += int(r.attrib.get(k, 0))
          with open('build/TEST_SUMMARY.txt','w',encoding='utf-8') as f:
              f.write(f"executed={t['tests']}\nfailures={t['failures']}\nerrors={t['errors']}\nskipped={t['skipped']}\n")
          if t['failures'] or t['errors']: raise SystemExit('test failures present')
          PY
          cat > build/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonJobs
          version=1.0.0
          release_candidate=v1.0.0-rc.2
          candidate_sha=${GITHUB_SHA}
          rollback_tag=v1.0.0-rc.1
          rollback_sha=e209dbc6e744882ae6cd5fd2426302f07f647010
          java=25
          class_major=69
          paper=26.2.build.121-stable
          plexoncore=2.0.4
          vault_api=1.7
          economy_authority=TheosisEconomy via Vault
          schema_version=2
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Create exact tag and prerelease
        shell: bash
        run: |
          set -euo pipefail
          existing=$(git rev-parse -q --verify 'refs/tags/v1.0.0-rc.2^{commit}' 2>/dev/null || true)
          if [[ -z "${existing}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/v1.0.0-rc.2' -f sha="${GITHUB_SHA}" >/dev/null
          fi
          gh release create 'v1.0.0-rc.2' \
            build/PlexonJobs-1.0.0-rc.2.jar build/SHA256SUMS.txt build/TEST_SUMMARY.txt build/PROVENANCE.txt \
            --prerelease --verify-tag --title 'PlexonJobs 1.0.0 RC2' --notes-file RELEASE_CANDIDATE.md
        env:
          GH_TOKEN: ${{ github.token }}
