name: Publish PlexonJobs 1.0.0 RC1 Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-1.0.0-rc.1]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse overwrite
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v1.0.0-rc.1' >/dev/null 2>&1; then
            echo 'v1.0.0-rc.1 already exists; refusing overwrite.' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision exact PlexonCore 2.0.2 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.2.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.2/PlexonCore-2.0.2.jar"
          echo "7e096ada4293017203cd4e01cb93761d169fa4c756fc46af520b2aed11a10ef5  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.2 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build and verify release candidate
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Generate and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/libs/PlexonJobs-1.0.0.jar | sed 's#build/libs/##' > build/SHA256SUMS.txt
          (cd build/libs && sha256sum --check ../SHA256SUMS.txt)

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create 'v1.0.0-rc.1' \
            build/libs/PlexonJobs-1.0.0.jar \
            build/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title 'PlexonJobs 1.0.0 RC1' \
            --notes-file RELEASE_CANDIDATE.md
        env:
          GH_TOKEN: ${{ github.token }}
