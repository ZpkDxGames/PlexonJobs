name: Release

on:
  push:
    branches: [release/stable]

permissions:
  contents: write
  actions: read

concurrency:
  group: plexonjobs-stable
  cancel-in-progress: false

env:
  PREVIOUS_STABLE_SHA: '985244c61a3c07c70fb48b97ccb2883fb55149b5'
  ROLLBACK_TAG: 'v2.0.0'
  ROLLBACK_SHA: '985244c61a3c07c70fb48b97ccb2883fb55149b5'
  ROLLBACK_JAR_SHA256: '686710eed31a6c10e9d78cb7fccc7fdc355330a371a098ba3731940ef048ad0a'
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact stable source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision verified PlexonCore API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-${CORE_VERSION}.jar"
          curl --fail --location --retry 3 --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v${CORE_VERSION}/PlexonCore-${CORE_VERSION}.jar"
          echo "${CORE_SHA256}  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion="$CORE_VERSION" -Dpackaging=jar -DgeneratePom=true

      - name: Resolve stable version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q properties | awk '$1 == "version:" {print $2; exit}')"
          test "$VERSION" = '2.5.0'
          [[ "$VERSION" != *-* ]] || { echo "Stable version must not contain a prerelease suffix: $VERSION" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Verify exact stable boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'release/stable'
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$main_sha"
          git merge-base --is-ancestor "$PREVIOUS_STABLE_SHA" HEAD
          test -s ".release/RELEASE_NOTES_${VERSION}.md"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to move a stable tag." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG release already exists; refusing replacement." >&2
            exit 1
          fi

      - name: Rebuild and test exact stable source
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Enforce 2.5 stable source contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/rc-release.yml
          test ! -e src/main/java/com/plexon/jobs/runtime/NativeActivityListener.java
          test -e src/main/java/com/plexon/jobs/runtime/ActivityInterestIndex.java
          test -e src/main/java/com/plexon/jobs/runtime/CompiledJobRoutes.java
          test -e src/main/java/com/plexon/jobs/runtime/ActivityListenerCoordinator.java
          test -e src/main/java/com/plexon/jobs/runtime/CoreBlockSubscriptionCoordinator.java
          grep -q 'joinedJobMask() & route.jobMask()' src/main/java/com/plexon/jobs/runtime/BlockActivityRouter.java
          grep -q 'handleBreak(Player player, Material material' src/main/java/com/plexon/jobs/runtime/ActivityGrantService.java
          grep -q 'HandlerList.unregisterAll' src/main/java/com/plexon/jobs/runtime/ActivityListenerCoordinator.java
          grep -q 'breakMaterialsForJobs(plugin.interest().globalJoinedJobMask())' src/main/java/com/plexon/jobs/runtime/CoreBlockSubscriptionCoordinator.java
          grep -q 'implements RewardFeedbackSink' src/main/java/com/plexon/jobs/runtime/PlayerFeedbackService.java
          grep -q 'feedback::flush' src/main/java/com/plexon/jobs/PlexonJobs.java
          grep -q 'getHandlerList().getRegisteredListeners().length != 0' src/main/java/com/plexon/jobs/runtime/ActivityGrantService.java
          grep -q 'participantCount(ActivityType.EXPLORE) > 0' src/main/java/com/plexon/jobs/runtime/ExplorerDiscoveryService.java
          grep -q 'implements InventoryHolder' src/main/java/com/plexon/jobs/gui/JobsMenuHolder.java
          grep -q 'DialogType.confirmation' src/main/java/com/plexon/jobs/gui/JobsMenuController.java
          for job in miner woodcutter digger farmer hunter fisher builder crafter blacksmith brewer enchanter explorer; do
            grep -A6 "^  ${job}:" src/main/resources/jobs.yml | grep -q 'enabled: true'
          done
          for hot in src/main/java/com/plexon/jobs/runtime/BlockActivityRouter.java src/main/java/com/plexon/jobs/runtime/ActivityGrantService.java; do
            ! grep -q 'Material.matchMaterial' "$hot"
            ! grep -q 'YamlConfiguration' "$hot"
            ! grep -q 'database\.' "$hot"
            ! grep -q 'payouts.flush' "$hot"
            ! grep -q 'runTask' "$hot"
          done
          ! grep -R -n --include='*.java' 'runTask\|runTaskAsynchronously' src/main/java/com/plexon/jobs/runtime/listener
          ! grep -R -n --include='*.java' 'database\.\|YamlConfiguration\|payouts.flush' src/main/java/com/plexon/jobs/runtime/listener
          ! grep -R -n --include='*.java' 'PlayerMoveEvent' src/main/java
          ! grep -R -n --include='*.java' 'org\.bukkit\.ChatColor' src/main/java
          ! grep -R -n --include='*.java' 'createInventory(null' src/main/java/com/plexon/jobs/gui
          ! grep -R -n --include='*.java' '\.getTitle()' src/main/java/com/plexon/jobs/gui
          ! grep -R -n --include='*.java' '\.getDisplayName()' src/main/java/com/plexon/jobs/gui

      - name: Build exact test summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = sorted(glob.glob('build/test-results/test/TEST-*.xml'))
          if not paths:
              raise SystemExit('No JUnit XML test results found')
          for path in paths:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] <= 0 or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(f'Non-clean test totals: {totals}')
          pathlib.Path('build/TEST_SUMMARY.txt').write_text(
              f"TEST_COUNT={totals['tests']} FAILURES={totals['failures']} ERRORS={totals['errors']} SKIPPED={totals['skipped']}\n",
              encoding='utf-8')
          print(totals)
          PY

      - name: Verify exact distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonJobs-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > build/jar-contents.txt
          for required in \
            plugin.yml \
            com/plexon/jobs/PlexonJobs.class \
            com/plexon/jobs/api/PlexonJobsAPI.class \
            com/plexon/jobs/gui/JobsMenuHolder.class \
            com/plexon/jobs/gui/JobsMenuController.class \
            com/plexon/jobs/gui/JobsGuiComponents.class \
            com/plexon/jobs/runtime/ActivityInterestIndex.class \
            com/plexon/jobs/runtime/CompiledJobRoutes.class \
            com/plexon/jobs/runtime/PlayerExecutionState.class \
            com/plexon/jobs/runtime/ActivityListenerCoordinator.class \
            com/plexon/jobs/runtime/CoreBlockSubscriptionCoordinator.class \
            com/plexon/jobs/runtime/ActivityGrantService.class \
            com/plexon/jobs/runtime/BlockActivityRouter.class \
            com/plexon/jobs/runtime/ExplorerDiscoveryService.class \
            com/plexon/jobs/runtime/PlayerFeedbackService.class \
            com/plexon/jobs/runtime/HunterOriginTracker.class \
            com/plexon/jobs/runtime/listener/HunterActivityListener.class \
            com/plexon/jobs/runtime/listener/BuilderActivityListener.class \
            com/plexon/jobs/runtime/listener/BrewerActivityListener.class \
            com/plexon/jobs/runtime/DailyLimitPersistence.class \
            com/plexon/jobs/event/PlexonJobRewardGrantedEvent.class \
            com/plexon/jobs/event/PlexonJobPayoutCommittedEvent.class \
            org/sqlite/JDBC.class; do
            grep -qx "$required" build/jar-contents.txt
          done
          ! grep -qx 'com/plexon/jobs/runtime/NativeActivityListener.class' build/jar-contents.txt
          unzip -p "$JAR" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d " '\"\r" | grep -qx "$VERSION"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx "Implementation-Version: $VERSION"
          javap -verbose -classpath "$JAR" com.plexon.jobs.PlexonJobs | grep -F 'major version: 69'
          for forbidden in 'com/zpkdxgames/plexoncore/' 'io/papermc/paper/' 'org/bukkit/' 'net/kyori/adventure/' 'net/milkbowl/vault/' 'me/clip/placeholderapi/'; do
            if grep -q "^${forbidden}" build/jar-contents.txt; then
              echo "Compile-only runtime API shaded into PlexonJobs: ${forbidden}" >&2
              exit 1
            fi
          done
          (cd build/libs && sha256sum "PlexonJobs-${VERSION}.jar" > ../SHA256SUMS.txt)
          (cd build/libs && sha256sum --check ../SHA256SUMS.txt)

      - name: Build exact stable provenance
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonJobs-${VERSION}.jar"
          digest="$(sha256sum "$JAR" | awk '{print $1}')"
          size="$(stat -c%s "$JAR")"
          cat > build/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          previous_stable_sha=$PREVIOUS_STABLE_SHA
          version=$VERSION
          channel=STABLE
          release_gate=GITHUB_SOURCE_CI_CERTIFIED
          java=25
          java_major=69
          paper=26.2.build.121-stable
          plexoncore=$CORE_VERSION
          rollback_tag=$ROLLBACK_TAG
          rollback_sha=$ROLLBACK_SHA
          rollback_jar_sha256=$ROLLBACK_JAR_SHA256
          player_interest_index=PASS
          dynamic_activity_listeners=PASS
          dynamic_core_break_subscription=PASS
          typed_break_route=PASS
          per_event_async_tasks=ABSENT
          per_event_sql=ABSENT
          per_event_vault_deposit=ABSENT
          feedback_coalesced_render=PASS
          custom_event_demand_gate=PASS
          explorer_move_event=ABSENT
          custom_inventory_holder=PASS
          legacy_gui_identity_antipatterns=ABSENT
          cross_process_vault_exactly_once=NOT_CLAIMED
          daily_cap_crash_exactness=NOT_CLAIMED
          jar_size=$size
          jar_sha256=$digest
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Publish GitHub stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "build/libs/PlexonJobs-${VERSION}.jar" \
            build/SHA256SUMS.txt \
            build/TEST_SUMMARY.txt \
            build/PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlexonJobs ${VERSION}" \
            --notes-file ".release/RELEASE_NOTES_${VERSION}.md" \
            --latest

      - name: Verify published stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish,assets > build/release.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('build/release.json', encoding='utf-8'))
          assert data['tagName'] == os.environ['RELEASE_TAG']
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          assert data['targetCommitish'] == os.environ['GITHUB_SHA']
          names={asset['name'] for asset in data['assets']}
          expected={f"PlexonJobs-{os.environ['VERSION']}.jar", 'SHA256SUMS.txt', 'TEST_SUMMARY.txt', 'PROVENANCE.txt'}
          assert names == expected, (names, expected)
          PY
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$latest_tag" = "$RELEASE_TAG"
          rm -rf published
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern "PlexonJobs-${VERSION}.jar" \
            --pattern 'SHA256SUMS.txt' \
            --pattern 'TEST_SUMMARY.txt' \
            --pattern 'PROVENANCE.txt'
          test "$(find published -maxdepth 1 -type f | wc -l)" -eq 4
          (cd published && sha256sum --check SHA256SUMS.txt)
          cmp build/TEST_SUMMARY.txt published/TEST_SUMMARY.txt
          cmp build/PROVENANCE.txt published/PROVENANCE.txt
          grep -Fx "source_sha=$GITHUB_SHA" published/PROVENANCE.txt
          grep -Fx 'channel=STABLE' published/PROVENANCE.txt
          grep -Fx 'release_gate=GITHUB_SOURCE_CI_CERTIFIED' published/PROVENANCE.txt
          grep -Fx 'player_interest_index=PASS' published/PROVENANCE.txt
          grep -Fx 'dynamic_activity_listeners=PASS' published/PROVENANCE.txt
          grep -Fx 'dynamic_core_break_subscription=PASS' published/PROVENANCE.txt
          grep -Fx 'typed_break_route=PASS' published/PROVENANCE.txt
          grep -Fx 'feedback_coalesced_render=PASS' published/PROVENANCE.txt
          grep -Fx 'custom_event_demand_gate=PASS' published/PROVENANCE.txt
          grep -Fx 'cross_process_vault_exactly_once=NOT_CLAIMED' published/PROVENANCE.txt
          grep -Fx 'daily_cap_crash_exactness=NOT_CLAIMED' published/PROVENANCE.txt
          grep -Fx 'runtime_certification=NOT_EXECUTED' published/PROVENANCE.txt
          grep -Eq '^TEST_COUNT=[1-9][0-9]* FAILURES=0 ERRORS=0 SKIPPED=0$' published/TEST_SUMMARY.txt

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: PlexonJobs-release-${{ github.sha }}
          path: |
            published/PlexonJobs-*.jar
            published/SHA256SUMS.txt
            published/TEST_SUMMARY.txt
            published/PROVENANCE.txt
          if-no-files-found: error
