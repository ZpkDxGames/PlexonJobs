name: Stable Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate stable tag and evidence gate
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^version = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag/version mismatch" >&2; exit 1; }
          test -f docs/STABLE_RELEASE_EVIDENCE.md || { echo 'Stable runtime evidence file is missing; candidate only.' >&2; exit 1; }
          grep -q '^status: STABLE-APPROVED$' docs/STABLE_RELEASE_EVIDENCE.md || { echo 'Stable evidence has not been approved.' >&2; exit 1; }
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo 'Release already exists; refusing asset overwrite.' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision exact PlexonCore 2.0.2 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.2.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.2/PlexonCore-2.0.2.jar"
          echo "7e096ada4293017203cd4e01cb93761d169fa4c756fc46af520b2aed11a10ef5  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.2 -Dpackaging=jar -DgeneratePom=true

      - name: Build verified stable artifact
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Checksum and publish
        shell: bash
        run: |
          set -euo pipefail
          sha256sum build/libs/PlexonJobs-1.0.0.jar | sed 's#build/libs/##' > build/SHA256SUMS.txt
          (cd build/libs && sha256sum --check ../SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" build/libs/PlexonJobs-1.0.0.jar build/SHA256SUMS.txt \
            --verify-tag --title "PlexonJobs ${GITHUB_REF_NAME#v}" --notes-file docs/STABLE_RELEASE_EVIDENCE.md
        env:
          GH_TOKEN: ${{ github.token }}
