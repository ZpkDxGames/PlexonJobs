name: RC Release

on:
  push:
    branches:
      - revamp/1.1.0-rc1
    paths:
      - .github/workflows/rc-release.yml

permissions:
  contents: write

env:
  STABLE_BASELINE_SHA: '24b8e61950cb3a01112351e19c733d9a80953a03'
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
  ROLLBACK_TAG: 'v1.0.0'
  ROLLBACK_SHA: '24b8e61950cb3a01112351e19c733d9a80953a03'
  ROLLBACK_JAR_SHA256: 'f6adfa64e60f195e9528be37c5e91e8938453a3c6635b5b2a5ba75a102cdeaa0'

concurrency:
  group: plexonjobs-1.1.0-rc.1-publish
  cancel-in-progress: false

jobs:
  publish-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision verified PlexonCore API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-${CORE_VERSION}.jar"
          curl --fail --location --retry 3 --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v${CORE_VERSION}/PlexonCore-${CORE_VERSION}.jar"
          echo "${CORE_SHA256}  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion="$CORE_VERSION" -Dpackaging=jar -DgeneratePom=true

      - name: Validate immutable candidate boundary
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'revamp/1.1.0-rc1'
          VERSION="$(gradle -q properties | awk '$1 == "version:" {print $2; exit}')"
          test "$VERSION" = '1.1.0-rc.1'
          TAG="v${VERSION}"
          git merge-base --is-ancestor "$STABLE_BASELINE_SHA" HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists; refusing to move it." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing asset overwrite." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Full exact-source verification
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution --stacktrace

      - name: Enforce revamp source contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/main/java/com/plexon/jobs/gui/JobsGui.java
          grep -q 'implements InventoryHolder' src/main/java/com/plexon/jobs/gui/JobsMenuHolder.java
          grep -q 'InventoryDragEvent' src/main/java/com/plexon/jobs/gui/JobsMenuController.java
          grep -q 'DailyLimitPersistence' src/main/java/com/plexon/jobs/runtime/BlockActivityRouter.java
          grep -q 'daily_earnings' src/main/java/com/plexon/jobs/storage/JobsDatabase.java
          ! grep -R -n --include='*.java' 'org\.bukkit\.ChatColor' src/main/java
          ! grep -R -n --include='*.java' 'createInventory(null' src/main/java/com/plexon/jobs/gui
          ! grep -R -n --include='*.java' '\.getTitle()' src/main/java/com/plexon/jobs/gui
          ! grep -R -n --include='*.java' '\.getDisplayName()' src/main/java/com/plexon/jobs/gui

      - name: Generate release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = sorted(glob.glob('build/test-results/test/TEST-*.xml'))
          if not paths:
              raise SystemExit('No JUnit XML test results found')
          for path in paths:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] <= 0 or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(f'Non-clean test totals: {totals}')
          pathlib.Path('build/TEST_SUMMARY.txt').write_text(
              f"TEST_COUNT={totals['tests']} FAILURES={totals['failures']} ERRORS={totals['errors']} SKIPPED={totals['skipped']}\n",
              encoding='utf-8')
          print(totals)
          PY

          JAR="build/libs/PlexonJobs-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > build/jar-contents.txt
          for required in \
            plugin.yml \
            com/plexon/jobs/PlexonJobs.class \
            com/plexon/jobs/api/PlexonJobsAPI.class \
            com/plexon/jobs/gui/JobsMenuHolder.class \
            com/plexon/jobs/gui/JobsMenuController.class \
            com/plexon/jobs/runtime/DailyLimitPersistence.class \
            com/plexon/jobs/runtime/DailyLimitService.class \
            org/sqlite/JDBC.class; do
            grep -qx "$required" build/jar-contents.txt
          done
          unzip -p "$JAR" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d " '\"\r" | grep -qx "$VERSION"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx "Implementation-Version: $VERSION"
          javap -verbose -classpath "$JAR" com.plexon.jobs.PlexonJobs | grep -F 'major version: 69'
          for forbidden in 'com/zpkdxgames/plexoncore/' 'io/papermc/paper/' 'org/bukkit/' 'net/kyori/adventure/' 'net/milkbowl/vault/' 'me/clip/placeholderapi/'; do
            if grep -q "^${forbidden}" build/jar-contents.txt; then
              echo "Compile-only runtime API shaded into PlexonJobs: ${forbidden}" >&2
              exit 1
            fi
          done
          (cd build/libs && sha256sum "PlexonJobs-${VERSION}.jar" > ../SHA256SUMS.txt)
          (cd build/libs && sha256sum --check ../SHA256SUMS.txt)

          digest="$(sha256sum "$JAR" | awk '{print $1}')"
          size="$(stat -c%s "$JAR")"
          cat > build/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          version=$VERSION
          tag=$TAG
          channel=PRERELEASE
          stable_baseline=$STABLE_BASELINE_SHA
          java=25
          java_major=69
          paper=26.2.build.121-stable
          plexoncore=$CORE_VERSION
          plexoncore_sha256=$CORE_SHA256
          vault_api=1.7
          economy_authority=TheosisEconomy via Vault
          schema_version=2
          rollback_tag=$ROLLBACK_TAG
          rollback_sha=$ROLLBACK_SHA
          rollback_jar_sha256=$ROLLBACK_JAR_SHA256
          profile_shutdown_write_barrier=PASS
          daily_cap_graceful_restart_persistence=PASS
          daily_snapshot_revision_guard=PASS
          daily_cap_crash_exactness=NOT_CLAIMED
          shadow_atomic_batch_persistence=PASS
          shadow_shutdown_write_barrier=PASS
          custom_inventory_holder=PASS
          legacy_gui_identity_antipatterns=ABSENT
          configurable_minimessage_surface=PASS
          malformed_yaml_reload_fail_closed=PASS
          cross_process_vault_exactly_once=NOT_CLAIMED
          jar_size=$size
          jar_sha256=$digest
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Publish immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "build/libs/PlexonJobs-${VERSION}.jar" \
            build/SHA256SUMS.txt \
            build/TEST_SUMMARY.txt \
            build/PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlexonJobs ${VERSION}" \
            --notes-file RELEASE_CANDIDATE.md \
            --prerelease

      - name: Verify public prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-list -n 1 "$TAG")"
          test "$tag_sha" = "$GITHUB_SHA"
          mkdir -p build/public-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir build/public-release
          test -s "build/public-release/PlexonJobs-${VERSION}.jar"
          test -s build/public-release/SHA256SUMS.txt
          test -s build/public-release/TEST_SUMMARY.txt
          test -s build/public-release/PROVENANCE.txt
          expected="$(awk '{print $1}' build/SHA256SUMS.txt)"
          actual="$(sha256sum "build/public-release/PlexonJobs-${VERSION}.jar" | awk '{print $1}')"
          test "$expected" = "$actual"
          cmp build/TEST_SUMMARY.txt build/public-release/TEST_SUMMARY.txt
          cmp build/PROVENANCE.txt build/public-release/PROVENANCE.txt
          grep -Fx "source_sha=$GITHUB_SHA" build/public-release/PROVENANCE.txt
          grep -Fx 'runtime_certification=NOT_EXECUTED' build/public-release/PROVENANCE.txt

      - name: Upload publisher evidence
        uses: actions/upload-artifact@v4
        with:
          name: PlexonJobs-${{ steps.meta.outputs.version }}-published-${{ github.sha }}
          path: |
            build/libs/PlexonJobs-${{ steps.meta.outputs.version }}.jar
            build/SHA256SUMS.txt
            build/TEST_SUMMARY.txt
            build/PROVENANCE.txt
          if-no-files-found: error
