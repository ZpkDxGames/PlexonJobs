name: PlexonJobs
version: '${version}'
main: com.plexon.jobs.PlexonJobs
api-version: '26.2'
author: ZpkDxGames
description: Full occupation, progression, economy and player-feedback system for PlexonCraft.
depend:
  - PlexonCore
softdepend:
  - Vault
  - PlaceholderAPI
commands:
  jobs:
    description: Browse and manage jobs.
    usage: /jobs
    aliases: [job]
  jobsadmin:
    description: PlexonJobs administration and diagnostics.
    usage: /jobsadmin
    permission: plexonjobs.admin
permissions:
  plexonjobs.admin:
    default: op
  plexonjobs.use:
    default: true
  plexonjobs.feedback:
    description: Receive PlexonJobs BossBar, reward sound and level-up feedback.
    default: true
  plexonjobs.maxjobs.1:
    default: true
