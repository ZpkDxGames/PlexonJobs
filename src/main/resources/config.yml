runtime:
  # DISABLED = no activity processing, SHADOW = calculate only, PRIMARY = mutate XP and accrue economy payouts.
  mode: SHADOW
  core-api-range: ">=2.0 <3.0"

membership:
  default-max-jobs: 3
  keep-level-on-leave: true

payout:
  # Phase 2 requires coalescing. IMMEDIATE/per-event Vault deposits are intentionally unsupported.
  mode: COALESCED
  flush-ticks: 40
  max-commits-per-tick: 100
  retry-limit: 3
  money-scale: 2

limits:
  reset-timezone: "America/Sao_Paulo"
  default-money-per-day: 5000.00
  default-xp-per-day: 250000

profiles:
  save-interval-ticks: 200

gameplay:
  allowed-game-modes: [SURVIVAL]
  disabled-worlds: []

diagnostics:
  log-payout-failures: true
  audit-retention-hours: 24

compatibility:
  claim-jobs-command: true
