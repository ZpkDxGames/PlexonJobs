runtime:
  # 2.5.0 keeps live rewards as the stable default. DISABLED = no activity, SHADOW = calculate only,
  # PRIMARY = mutate XP/daily counters and accrue coalesced economy payouts.
  mode: PRIMARY
  core-api-range: ">=2.0 <3.0"

membership:
  default-max-jobs: 3
  keep-level-on-leave: true

performance:
  # Native activity-family listeners exist only while at least one online participant needs them.
  dynamic-listeners: true
  # PlexonCore receives only the union of break materials needed by active online break-job members.
  dynamic-core-block-subscription: true
  # One global bounded visual flush; reward callbacks only accumulate compact state.
  feedback-flush-ticks: 3

payout:
  # Vault deposits remain outside gameplay-event paths and are coalesced.
  mode: COALESCED
  flush-ticks: 40
  max-commits-per-tick: 100
  retry-limit: 3
  money-scale: 2

limits:
  reset-timezone: "America/Sao_Paulo"
  default-money-per-day: 5000.00
  default-xp-per-day: 250000

profiles:
  save-interval-ticks: 200

gameplay:
  allowed-game-modes: [SURVIVAL]
  disabled-worlds: []

activity:
  hunter:
    # MEMORY avoids PDC writes for every spawn. PERSISTENT_PDC trades more writes for origin survival across unload/restart.
    origin-tracking: MEMORY
    # Unknown, spawner, egg, breeding, command and plugin-custom origins fail closed by default.
    allowed-spawn-reasons: [NATURAL, RAID, PATROL, TRAP, REINFORCEMENTS, NETHER_PORTAL, VILLAGE_INVASION]
  builder:
    repeat-window-seconds: 600
    max-tracked-positions: 4096
  brewer:
    attribution-seconds: 90
  explorer:
    # Samples only the compiled online Explorer participant collection; never PlayerMoveEvent.
    sample-ticks: 40

feedback:
  enabled: true
  bossbar:
    enabled: true
    duration-ticks: 60
  reward-sound:
    enabled: true
    key: "minecraft:entity.experience_orb.pickup"
    volume: 0.35
    pitch: 1.35
  level-up:
    title-enabled: true
    sound-enabled: true
    sound: "minecraft:entity.player.levelup"
    volume: 0.80
    pitch: 1.10
